<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="100" fill="#000000"/>
  <!-- Glowing border ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#22c55e" stroke-width="12" stroke-opacity="0.8"/>
  <!-- Setlist / Sheet Music + Audio waveform / chords emblem -->
  <g transform="translate(96, 80)">
    <!-- Setlist document backing -->
    <rect x="20" y="20" width="280" height="340" rx="24" fill="#121212" stroke="#22c55e" stroke-width="16"/>
    <!-- Setlist lines -->
    <line x1="60" y1="90" x2="260" y2="90" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="60" y1="150" x2="200" y2="150" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
    <line x1="60" y1="210" x2="260" y2="210" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <line x1="60" y1="270" x2="180" y2="270" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
    <!-- Music note / stage transport badge -->
    <circle cx="250" cy="280" r="56" fill="#22c55e"/>
    <polygon points="240,260 270,280 240,300" fill="#000000"/>
  </g>
</svg>
